<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studex — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-screen">

    <!-- Left: brand hero -->
    <section class="login-hero">
      <div class="brand">
        <span class="brand-mark">S</span>
        Studex
      </div>

      <div class="login-hero-copy">
        <h1>Your whole term, sorted.</h1>
        <p>Courses, schedule, and profile — gathered in the one place built around you, the student.</p>
      </div>

      <div class="login-hero-foot"></div>
    </section>

    <!-- Right: login form -->
    <section class="login-panel">
      <div class="login-form-wrap">
        <h2>Welcome back</h2>
        <p>Sign in to your Studex account.</p>

        <form action="home.html" method="get">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@university.edu" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>

          <div class="field-row">
            <label style="display:flex; align-items:center; gap:6px; font-weight:500; color:var(--gray-500);">
              <input type="checkbox" style="width:auto;"> Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <div class="divider">or</div>

        <p class="signup-note">New to Studex? <a href="#">Create an account</a></p>
      </div>
    </section>

  </div>

</body>
</html>
